type Query {
  listBankAccount: [BankAccount!]
}

type Mutation {
  createBankAccount(bankName: String!, accountNumber: String!): BankAccount
  deleteBankAccount(id: ID!): Boolean
}

type BankAccount {
  id: ID!
  uuid: String
  userId: String
  bankName: String
  accountNumber: String
  visible: Boolean
  balance: Int
  createdAt: String
  modifiedAt: String
}
